<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Ceci n'est pas une page</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: Georgia, serif;
      color: #fff;
      background: linear-gradient(135deg, #1e3c72, #2a5298, #6a3093);
    }
    h1 {
      font-size: 9rem;
      margin: 0;
      letter-spacing: 1rem;
    }
    .frame {
      border: 4px solid #fff;
      padding: 2rem 3rem;
      background: rgba(0, 0, 0, 0.3);
    }
    p {
      font-size: 1.6rem;
      font-style: italic;
    }
    small {
      display: block;
      margin-bottom: 1.5rem;
      opacity: 0.8;
    }
    a {
      color: #fff;
      border: 2px solid #fff;
      padding: 0.6rem 1.4rem;
      text-decoration: none;
      border-radius: 30px;
    }
    a:hover {
      background: #fff;
      color: #2a5298;
    }
  </style>
</head>
<body>
  <div class="frame">
    <h1>404</h1>
    <p>Ceci n'est pas une page</p>
    <small>This is not a page. The page you want does not exist.</small>
    <a href="/">Back to the home page</a>
  </div>
</body>
</html>
